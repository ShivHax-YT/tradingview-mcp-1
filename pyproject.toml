[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-ai-chart-copilot"
version = "0.1.0"
description = "Manual paper-trading decision-support copilot for MNQ/MES. Python calculates, Claude explains, human approves. No broker execution, ever."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.58", "plotly>=5.20"]

[project.scripts]
copilot = "futures_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
