# Futures AI Chart Copilot — v0.1 configuration
# Python calculates. Claude explains. Human approves.

app:
  db_path: data/copilot.db
  packets_dir: packets   # Claude prompt packets (JSON + Markdown) land here
  timezone: America/New_York   # session definitions; storage is always UTC epoch

symbols:
  MNQ:
    chart_symbol: "CME_MINI:MNQ1!"   # symbol sent to TradingView Desktop
    tick_size: 0.25
    tick_value: 0.50                 # USD per tick per contract
    fvg_min_ticks: 4                 # strategy entry gaps smaller than this are ignored
  MES:
    chart_symbol: "CME_MINI:MES1!"
    tick_size: 0.25
    tick_value: 1.25
    fvg_min_ticks: 4

# Canonical timeframes used across the app. TradingView resolution strings mapped explicitly.
# NOTE: 4h removed from canonical — it is not backfilled and not derivable from ~8h of
# stored 1m data. Re-add it only when the backfill actually supports it.
timeframes:
  canonical: ["1m", "3m", "5m", "15m", "1h"]
  tradingview_map:
    1m: "1"
    3m: "3"
    5m: "5"
    15m: "15"
    1h: "60"

data:
  # Product path: TradingView Desktop via tradesdontlie/tradingview-mcp (CDP :9222).
  # Fixtures are for tests/offline dev ONLY. There is no other fallback, by design.
  source: tvmcp
  tvmcp:
    node_command: node
    server_path: vendor/tradingview-mcp/src/server.js
    cdp_port: 9222
    request_timeout_s: 30
    max_bars_per_call: 500          # hard limit of data_get_ohlcv
    max_live_data_latency_s: 5      # fail closed after the active bar is >5s overdue
  backfill:
    # data_get_ohlcv returns the NEWEST <=500 bars for the chart's active timeframe.
    # Deep 1m history is unreachable, so backfill pulls each timeframe natively.
    timeframes: ["1m", "5m", "15m", "1h"]
    bars_per_timeframe: 500
  collect:
    timeframe: 1m                   # incremental collection is 1m-only; HTFs resampled
    interval_s: 30                  # polling interval in --loop mode
    drop_unclosed_last_bar: true    # last bar is forming; never store it

sessions:
  # All times America/New_York. CME trading day starts 18:00 ET the prior evening.
  trading_day_start: "18:00"
  maintenance_break: ["17:00", "18:00"]
  asia:   ["18:00", "03:00"]
  london: ["03:00", "09:30"]
  ny:     ["09:30", "16:00"]
  opening_range_minutes: 15

features:
  # Feature-engine parameters (used by `copilot state` and the strategy phases).
  swing_k: 3                 # wider fractal rejects two-bar noise pivots from MSS
  atr_period: 14             # Wilder ATR period
  fvg_lookback_bars: 200     # how many recent 5m bars to scan for FVGs in market state
  max_fvgs_in_state: 5       # cap on open/mitigated FVGs reported in market state
  # Level resolution: session/day/prior-day levels use the finest timeframe that
  # COVERS the window (1m -> 5m -> 15m -> 1h). Opening range is 1m-only, hardcoded.

strategies:
  # Plugin strategies producing CANDIDATES only. Decisions come from the risk gate.
  enabled: ["session_liquidity_trap"]   # orb_breakout is a skeleton; enable deliberately
  detection_timeframe: 5m
  lookback_bars: 96              # ~8h of 5m bars scanned per pass
  confirm_max_candles: 12        # sweep -> MSS/CISD budget (5m candles)
  stop_buffer_atr_mult: 0.25     # stop = sweep extreme -/+ this * ATR(14, 5m)
  entry_zone_atr_mult: 0.15      # structure-retest entry zone half-width
  min_target_rr_for_grade_a: 2.0
  max_candidates_per_scan: 3
  orb:
    enabled: false               # conservative default; breakout/fakeout playbook is v0.2
    confirm_timeframe: 5m
    retest_max_candles: 6

memory:
  # Similar-setup memory. v0.1 = deterministic SQL lookup (always on, no config).
  # The vector adapter is an OPTIONAL local scaffold: no network embeddings,
  # no paid services. backend "chroma" needs `pip install chromadb`.
  vector:
    enabled: false
    backend: memory        # memory | chroma
    path: data/vector_memory
    top_k: 5

risk:
  # Consumed by the risk/freshness gate (Phase 4). Defined now so schema/config are stable.
  manual_approval_required: true    # hard rule, not configurable at runtime
  auto_execution_enabled: false     # permanently false in this project
  min_rr: 1.5
  max_signals_per_session: 2
  max_signals_per_day: 3
  signal_expiry_candles: 3
  max_feed_staleness_s: 180       # closed-candle gate/dashboard share this limit
  reclaim_max_candles: 3            # spec range 3-5; start strict
  max_stop_atr_mult: 2.0            # stop wider than N*ATR(14) rejects
  max_entry_distance_atr_mult: 0.5  # price farther than N*ATR from entry zone = chased
  min_target_atr_mult: 0.5          # target closer than this*ATR = not worth it
  chop_min_day_range_atr_mult: 2.0  # day span < this*ATR15 = chop, stand down
  allowed_sessions: ["ny"]          # Desk Mode v0.2: NY session only
  min_actionable_grades: ["A", "B"] # C-grade setups are journal-only WAITs
  # ── Desk Mode v0.2 ──
  # Golden hour (America/New_York): start inclusive, end exclusive.
  enforce_golden_hour: true
  golden_hour: ["09:30", "11:00"]
  # Trade governor over JOURNALED trade_reviews of the same trading day:
  # one journaled win = done for the day; N journaled losses = done.
  # Skipped trades and scratch (0R) results count as neither.
  stop_on_first_win: true
  stop_after_losses: 2
  # Equal high/low stop-magnet filter: reject when >=2 recent detection-TF bars
  # have lows (long) / highs (short) within tolerance ticks of the stop.
  reject_equal_level_stop_magnets: true
  equal_level_tolerance_ticks: 3
  equal_level_lookback_bars: 50
  # MANUAL news windows (America/New_York wall clock). No scraping, no feeds —
  # if it matters, you type it in. Example:
  #   news_blackouts:
  #     - {start: "2026-07-02 08:30", minutes: 30, label: "NFP"}
  news_blackouts: []

preflight:
  # Desk Memory / Preflight (v0.3): deterministic journal memory built from
  # SQLite BEFORE a session (`copilot preflight`). Statistics and reminders,
  # not model training. Never runs in the live scan loop; never reads Obsidian.
  enabled: true
  memory_dir: data/session_memory
  lookback_reviews: 50
  lookback_days: 20
  top_mistakes: 5
  min_samples_for_pattern: 3

vault:
  # Obsidian vault used ONLY by `copilot prep` (session-prep cache written to
  # data/session_prep/). The live scan/risk gate/dashboard refresh NEVER read
  # the vault — Python/risk gate first, Claude/Obsidian later.
  path: "C:/Users/ShivHax/Documents/Trading Brain"
  session_prep_dir: data/session_prep
  max_chars_per_note: 4000

backtest:
  # Conservative, symbol-specific adverse fill assumptions (ticks).
  slippage:
    MNQ: {entry_ticks: 1, stop_ticks: 2, target_ticks: 1}
    MES: {entry_ticks: 1, stop_ticks: 2, target_ticks: 1}
